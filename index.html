RAfpTF3l4FMkyDwOd2yxhe/in9yvwOV0vfJPijKMjRE+rcHrpw3VsAxuazl4UOlSWBxirgbi+/MZoy4+Rvv5CkpzXk4exXeeBpamsDFQStqHMLQ/UYKRYUI30HY8ddE3fnGspWoywmX6emdF5HK2Qt34/xDqZzOh0cT3M4vaUditrq2rW+UzNusCzMGOpl408mQI2VA2ZqyEFeukHY99HCShKqFtIsNgn8rM3fD24WKAG+zwyL3HxAk+XULB8oMnIE9mZdsMGYKtIL6lxUxohCKnzjPzZl8KjjWvTuL+ozGDLlpa3zPkXVAh+FC3xr0USIJlTMidCwIkEMj1JPWo5A=="};
  const STORE = 'ccu-dashboard-key';
  const $ = id => document.getElementById(id);
  const form = $('f'), pw = $('pw'), go = $('go'), keep = $('keep'), err = $('err');

  const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const text = u => btoa(String.fromCharCode.apply(null, u));
  // Phones capitalise and autocorrect, so "Maple river" opens like
  // "maple-river". Must match tidy() in lock_page.mjs and set_password.py.
  const tidy = s => s.trim().toLowerCase().split(/[\s-]+/).filter(Boolean).join('-');

  async function derive(password) {
    const base = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(tidy(password)), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits(
      { name: 'PBKDF2', hash: 'SHA-256', salt: bytes(LOCKED.salt), iterations: LOCKED.iter },
      base, 256));
  }

  async function unlock(raw) {
    const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    const page = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: bytes(LOCKED.iv) }, key, bytes(LOCKED.ct));
    return new TextDecoder().decode(page);
  }

  // The derived key is kept, not the password. The salt stays fixed between
  // weekly builds, so a remembered key keeps working until the password changes.
  function remember(raw) { try { localStorage.setItem(STORE, text(raw)); } catch (e) {} }
  function forget() { try { localStorage.removeItem(STORE); } catch (e) {} }
  function recall() {
    try { const k = localStorage.getItem(STORE); return k ? bytes(k) : null; }
    catch (e) { return null; }
  }

  function show(html) {
    removeEventListener('hashchange', onHash);
    document.open(); document.write(html); document.close();
  }

  // Tapping the quick link while this page is already open changes only the
  // part after #, which reloads nothing. Once the dashboard is showing, its own
  // #section links must be left alone, hence the listener comes off in show().
  function onHash() { if (/^#k=/.test(location.hash)) start(); }
  addEventListener('hashchange', onHash);

  function ask(message) {
    form.hidden = false;
    err.textContent = message || '';
    go.disabled = false;
    pw.focus();
  }

  async function start() {
    if (!window.crypto || !crypto.subtle) {
      return ask("This browser can't open the page. Try an up-to-date browser.");
    }
    // A link ending #k=<password> opens without typing. Take it out of the
    // address bar first, so it is not left on screen or in the history.
    const m = location.hash.match(/^#k=(.+)$/);
    if (m) {
      history.replaceState(null, '', location.pathname + location.search);
      try {
        const raw = await derive(decodeURIComponent(m[1]));
        const html = await unlock(raw);
        remember(raw);
        return show(html);
      } catch (e) {}
    }
    const saved = recall();
    if (saved) {
      try { return show(await unlock(saved)); }
      catch (e) { forget(); }      // the password has changed since
    }
    ask(m ? "That link's password didn't work. Enter the password instead." : '');
  }

  form.addEventListener('submit', async e => {
    e.preventDefault();
    go.disabled = true;
    err.textContent = '';
    try {
      const raw = await derive(pw.value);
      const html = await unlock(raw);
      if (keep.checked) remember(raw); else forget();
      show(html);
    } catch (e2) {
      ask("That password didn't work. Check it and try again.");
      pw.select();
    }
  });

  start();
})();
